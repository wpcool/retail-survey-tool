                <!-- 竞店管理部分 -->
                <div class="stats-row" style="grid-template-columns: repeat(4, 1fr); margin-top: 32px;">
                    <div class="stat-card">
                        <div class="stat-icon blue">🏪</div>
                        <div class="stat-info">
                            <h3>门店总数</h3>
                            <div class="value" id="competitorStoreTotal">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">🏢</div>
                        <div class="stat-info">
                            <h3>竞店总数</h3>
                            <div class="value" id="competitorTotal">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">📊</div>
                        <div class="stat-info">
                            <h3>平均竞店数</h3>
                            <div class="value" id="competitorAvg">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">🏆</div>
                        <div class="stat-info">
                            <h3>竞店最多</h3>
                            <div class="value" id="competitorMaxStore" style="font-size: 18px;">-</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🏪 竞店管理</span>
                        <button class="btn btn-success" onclick="exportCompetitorStores()">📥 导出数据</button>
                    </div>
                    <div class="card-body">
                        <div class="search-bar">
                            <select class="search-input" id="competitorStoreFilter" onchange="filterCompetitorStores()">
                                <option value="">所有门店</option>
                            </select>
                            <input type="text" class="search-input" id="competitorKeywordFilter" placeholder="🔍 搜索竞店名称..." oninput="filterCompetitorStores()">
                            <button class="btn btn-default" onclick="loadCompetitorStores()">🔄 刷新</button>
                        </div>
                        <div class="table-container" id="competitorStoresContainer">
                            <table>
                                <thead>
                                    <tr>
                                        <th>门店名称</th>
                                        <th>竞店数量</th>
                                        <th>竞店列表</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="competitorStoresTable">
                                    <tr><td colspan="4" class="empty-state">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="competitorStoresPagination" class="pagination"></div>
                    </div>
                </div>
            `;
        }
        
        // 过滤后的人员列表
        let filteredSurveyors = [];
        let currentSurveyorPage = 1;
        const PAGE_SIZE = 10;
        
        async function loadSurveyors() {
            try {
                showLoading('surveyorTable');
                const res = await fetch(`${API_BASE}/api/surveyors`);
                const surveyors = await res.json();
                currentData.surveyors = surveyors;
                
                // 更新统计
                updateSurveyorStats(surveyors);
                
                // 更新筛选下拉框
                const select = document.getElementById('recordSurveyorFilter');
                if (select) select.innerHTML = '<option value="">所有人员</option>' + surveyors.filter(s => s.is_active).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                
                // 应用过滤
                filterSurveyors();
                
                // 同时加载竞店数据
                loadCompetitorStores();
            } catch (e) { 
                document.getElementById('surveyorTable').innerHTML = '<tr><td colspan="7" class="empty-state"><span class="icon">❌</span><p>加载失败，请重试</p></td></tr>'; 
            }
        }
        
        function updateSurveyorStats(surveyors) {
            const total = surveyors.length;
            const active = surveyors.filter(s => s.is_active).length;
            const inactive = total - active;
            
            // 计算本月新增
            const now = new Date();
            const thisMonth = now.getMonth();
            const thisYear = now.getFullYear();
            const newThisMonth = surveyors.filter(s => {
                const created = new Date(s.created_at);
                return created.getMonth() === thisMonth && created.getFullYear() === thisYear;
            }).length;
            
            animateNumber(document.getElementById('surveyorTotal'), total);
            animateNumber(document.getElementById('surveyorActive'), active);
            animateNumber(document.getElementById('surveyorInactive'), inactive);
            animateNumber(document.getElementById('surveyorNew'), newThisMonth);
        }
        
        function filterSurveyors() {
            const searchTerm = document.getElementById('surveyorSearch')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('surveyorStatusFilter')?.value || '';
            
            filteredSurveyors = currentData.surveyors.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(searchTerm) || 
                                   s.username.toLowerCase().includes(searchTerm) ||
                                   (s.phone && s.phone.includes(searchTerm));
                const matchStatus = !statusFilter || 
                                   (statusFilter === 'active' && s.is_active) ||
                                   (statusFilter === 'inactive' && !s.is_active);
                return matchSearch && matchStatus;
            });
            
            currentSurveyorPage = 1;
            renderSurveyorTable();
        }
        
        function renderSurveyorTable() {
            const start = (currentSurveyorPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageData = filteredSurveyors.slice(start, end);
            
            if (filteredSurveyors.length === 0) {
                document.getElementById('surveyorTable').innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <span class="icon" style="font-size: 48px;">🔍</span>
                        <p style="margin-top: 16px; font-size: 16px;">没有找到匹配的人员</p>
                        <button class="btn btn-primary" style="margin-top: 16px;" onclick="openSurveyorModal()">+ 添加人员</button>
                    </td></tr>
                `;
                document.getElementById('surveyorPagination').innerHTML = '';
                return;
            }
            
            const html = pageData.map((s, i) => `
                <tr style="animation-delay: ${i * 0.05}s">
                    <td><strong style="color: var(--primary);">#${s.id}</strong></td>
                    <td>${s.username}</td>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.phone || '<span style="color: #94a3b8;">-</span>'}</td>
                    <td><span class="tag ${s.is_active ? 'tag-success' : 'tag-error'}">${s.is_active ? '正常' : '已禁用'}</span></td>
                    <td>${new Date(s.created_at).toLocaleString()}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-sm btn-warning" onclick="editSurveyor(${s.id})">编辑</button>
                            <button class="btn btn-sm btn-primary" onclick="resetPassword(${s.id})">重置密码</button>
                            <button class="btn btn-sm ${s.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleSurveyor(${s.id})">${s.is_active ? '禁用' : '启用'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSurveyor(${s.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('surveyorTable').innerHTML = html;
            renderSurveyorPagination();
        }
        
        function renderSurveyorPagination() {
            const totalPages = Math.ceil(filteredSurveyors.length / PAGE_SIZE);
            if (totalPages <= 1) {
                document.getElementById('surveyorPagination').innerHTML = '';
                return;
            }
            
            let html = `
                <button class="page-btn" ${currentSurveyorPage === 1 ? 'disabled' : ''} onclick="goToSurveyorPage(${currentSurveyorPage - 1})">上一页</button>
            `;
            
            // 始终显示第一页
            html += `<button class="page-btn ${1 === currentSurveyorPage ? 'active' : ''}" onclick="goToSurveyorPage(1)">1</button>`;
            
            // 计算中间页码显示范围
            let startPage = Math.max(2, currentSurveyorPage - 1);
            let endPage = Math.min(totalPages - 1, currentSurveyorPage + 1);
            
            if (currentSurveyorPage <= 3) {
                endPage = Math.min(totalPages - 1, 4);
            } else if (currentSurveyorPage >= totalPages - 2) {
                startPage = Math.max(2, totalPages - 3);
            }
            
            // 前面省略号
            if (startPage > 2) {
                html += `<span class="pagination-ellipsis">...</span>`;
            }
            
            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentSurveyorPage ? 'active' : ''}" onclick="goToSurveyorPage(${i})">${i}</button>`;
            }
            
            // 后面省略号
            if (endPage < totalPages - 1) {
                html += `<span class="pagination-ellipsis">...</span>`;
            }
            
            // 最后一页
            if (totalPages > 1) {
                html += `<button class="page-btn ${totalPages === currentSurveyorPage ? 'active' : ''}" onclick="goToSurveyorPage(${totalPages})">${totalPages}</button>`;
            }
            
            html += `
                <button class="page-btn" ${currentSurveyorPage === totalPages ? 'disabled' : ''} onclick="goToSurveyorPage(${currentSurveyorPage + 1})">下一页</button>
                <span class="pagination-info">共 ${filteredSurveyors.length} 人</span>
            `;
            
            document.getElementById('surveyorPagination').innerHTML = html;
        }
        
        function goToSurveyorPage(page) {
            currentSurveyorPage = page;
            renderSurveyorTable();
            document.getElementById('surveyorTable').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // ==================== 竞店管理 ====================
        let competitorStoresData = [];
        let filteredCompetitorStores = [];
        let currentCompetitorPage = 1;
        const COMPETITOR_PAGE_SIZE = 10;
        
        async function loadCompetitorStores() {
            try {
                showLoading('competitorStoresTable');
                
                // 加载统计数据
                const statsRes = await fetch(`${API_BASE}/api/competitor-stores/stats`);
                const stats = await statsRes.json();
                
                animateNumber(document.getElementById('competitorStoreTotal'), stats.total_stores);
                animateNumber(document.getElementById('competitorTotal'), stats.total_competitors);
                animateNumber(document.getElementById('competitorAvg'), stats.avg_competitors);
                document.getElementById('competitorMaxStore').textContent = stats.max_store || '-';
                
                // 加载门店下拉选项
                const storesRes = await fetch(`${API_BASE}/api/competitor-stores/stores`);
                const stores = await storesRes.json();
                const storeSelect = document.getElementById('competitorStoreFilter');
                if (storeSelect) {
                    storeSelect.innerHTML = '<option value="">所有门店</option>' + 
                        stores.map(s => `<option value="${s}">${s}</option>`).join('');
                }
                
                // 加载竞店数据
                const res = await fetch(`${API_BASE}/api/competitor-stores`);
                competitorStoresData = await res.json();
                
                filterCompetitorStores();
            } catch (e) {
                console.error('加载竞店数据失败:', e);
                document.getElementById('competitorStoresTable').innerHTML = 
                    '<tr><td colspan="4" class="empty-state"><span class="icon">❌</span><p>加载失败，请重试</p></td></tr>';
            }
        }
        
        function filterCompetitorStores() {
            const storeFilter = document.getElementById('competitorStoreFilter')?.value || '';
            const keywordFilter = document.getElementById('competitorKeywordFilter')?.value.toLowerCase() || '';
            
            filteredCompetitorStores = competitorStoresData.filter(item => {
                const matchStore = !storeFilter || item.store === storeFilter;
                const matchKeyword = !keywordFilter || 
                    item.store.toLowerCase().includes(keywordFilter) ||
                    item.competitors.some(c => c.toLowerCase().includes(keywordFilter));
                return matchStore && matchKeyword;
            });
            
            currentCompetitorPage = 1;
            renderCompetitorStoresTable();
        }
        
        function renderCompetitorStoresTable() {
            const start = (currentCompetitorPage - 1) * COMPETITOR_PAGE_SIZE;
            const end = start + COMPETITOR_PAGE_SIZE;
            const pageData = filteredCompetitorStores.slice(start, end);
            
            if (filteredCompetitorStores.length === 0) {
                document.getElementById('competitorStoresTable').innerHTML = `
                    <tr><td colspan="4" class="empty-state">
                        <span class="icon" style="font-size: 48px;">🔍</span>
                        <p style="margin-top: 16px; font-size: 16px;">没有找到匹配的竞店数据</p>
                    </td></tr>
                `;
                document.getElementById('competitorStoresPagination').innerHTML = '';
                return;
            }
            
            const html = pageData.map((item, i) => {
                const competitorsHtml = item.competitors.map(c => 
                    `<span class="tag tag-default" style="margin: 2px; display: inline-block;">${c}</span>`
                ).join('');
                
                return `
                    <tr style="animation-delay: ${i * 0.05}s">
                        <td><strong style="color: var(--primary); font-size: 15px;">${item.store}</strong></td>
                        <td><span class="tag tag-success">${item.count} 家</span></td>
                        <td style="max-width: 600px; line-height: 2;">${competitorsHtml}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-sm btn-primary" onclick="manageCompetitors('${item.store}')">🏪 管理竞店</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('competitorStoresTable').innerHTML = html;
            renderCompetitorStoresPagination();
        }
        
        function renderCompetitorStoresPagination() {
            const totalPages = Math.ceil(filteredCompetitorStores.length / COMPETITOR_PAGE_SIZE);
            if (totalPages <= 1) {
                document.getElementById('competitorStoresPagination').innerHTML = '';
                return;
            }
            
            let html = `
                <button class="page-btn" ${currentCompetitorPage === 1 ? 'disabled' : ''} onclick="goToCompetitorPage(${currentCompetitorPage - 1})">上一页</button>
            `;
            
            // 始终显示第一页
            html += `<button class="page-btn ${1 === currentCompetitorPage ? 'active' : ''}" onclick="goToCompetitorPage(1)">1</button>`;
            
            // 计算中间页码显示范围
            let startPage = Math.max(2, currentCompetitorPage - 1);
            let endPage = Math.min(totalPages - 1, currentCompetitorPage + 1);
            
            // 如果当前页靠近开始，显示更多后面的页
            if (currentCompetitorPage <= 3) {
                endPage = Math.min(totalPages - 1, 4);
            }
            // 如果当前页靠近结束，显示更多前面的页
            else if (currentCompetitorPage >= totalPages - 2) {
                startPage = Math.max(2, totalPages - 3);
            }
            
            // 显示前面的省略号
            if (startPage > 2) {
                html += `<span class="pagination-ellipsis">...</span>`;
            }
            
            // 显示中间页码
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentCompetitorPage ? 'active' : ''}" onclick="goToCompetitorPage(${i})">${i}</button>`;
            }
            
            // 显示后面的省略号
            if (endPage < totalPages - 1) {
                html += `<span class="pagination-ellipsis">...</span>`;
            }
            
            // 始终显示最后一页（如果不是第一页）
            if (totalPages > 1) {
                html += `<button class="page-btn ${totalPages === currentCompetitorPage ? 'active' : ''}" onclick="goToCompetitorPage(${totalPages})">${totalPages}</button>`;
            }
            
            html += `
                <button class="page-btn" ${currentCompetitorPage === totalPages ? 'disabled' : ''} onclick="goToCompetitorPage(${currentCompetitorPage + 1})">下一页</button>
                <span class="pagination-info">共 ${filteredCompetitorStores.length} 条</span>
            `;
            
            document.getElementById('competitorStoresPagination').innerHTML = html;
        }
        
        function goToCompetitorPage(page) {
            currentCompetitorPage = page;
            renderCompetitorStoresTable();
            document.getElementById('competitorStoresTable').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function exportCompetitorStores() {
            // 导出竞店数据为CSV
            let csv = '门店名称,竞店数量,竞店列表\n';
            filteredCompetitorStores.forEach(item => {
                csv += `"${item.store}",${item.count},"${item.competitors.join('; ')}"\n`;
            });
            
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `竞店数据_${new Date().toLocaleDateString()}.csv`;
            link.click();
            
            showToast('竞店数据导出成功', 'success');
        }
        
        // 当前管理的门店
        let currentManagingStore = null;
        let currentStoreCompetitors = [];
        
        // 打开竞店管理弹窗
        async function manageCompetitors(storeName) {
            currentManagingStore = storeName;
            
            // 获取该门店的竞店列表（带ID）
            try {
                const res = await fetch(`${API_BASE}/api/competitor-stores/${encodeURIComponent(storeName)}`);
                currentStoreCompetitors = await res.json();
            } catch (e) {
                showToast('获取竞店数据失败', 'error');
                return;
            }
            
            const body = `
                <div style="margin-bottom: 20px;">
                    <div style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px;">
                        <div style="font-size: 12px; opacity: 0.9; margin-bottom: 4px;">管理门店</div>
                        <div style="font-size: 20px; font-weight: 700;">🏪 ${storeName}</div>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                        <input type="text" id="newCompetitorName" class="form-control" placeholder="输入竞店名称..." style="flex: 1;">
                        <button class="btn btn-primary" onclick="addNewCompetitor()">➕ 添加</button>
                    </div>
                    
                    <div id="competitorsList" style="max-height: 300px; overflow-y: auto;">
                        ${renderCompetitorsList()}
                    </div>
                </div>
            `;
            
            openModal(`🏪 管理竞店 - ${storeName}`, body, null, false);
        }
        
        // 渲染竞店列表
        function renderCompetitorsList() {
            if (currentStoreCompetitors.length === 0) {
                return `
                    <div class="empty-state" style="padding: 40px;">
                        <span class="icon" style="font-size: 48px;">📭</span>
                        <p style="margin-top: 16px; color: #64748b;">暂无竞店数据</p>
                    </div>
                `;
            }
            
            return currentStoreCompetitors.map((c, idx) => `
                <div class="competitor-item" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; animation: slideInUp 0.3s both; animation-delay: ${idx * 0.05}s;">
                    <span style="background: #6366f1; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">${idx + 1}</span>
                    <span class="competitor-name" style="flex: 1; font-weight: 500; color: #1e293b;">${c.name}</span>
                    <input type="text" class="competitor-edit-input form-control" value="${c.name}" style="flex: 1; display: none; padding: 8px 12px;">
                    <div class="action-btns">
                        <button class="btn btn-sm btn-warning edit-btn" onclick="startEditCompetitor(${c.id}, this)">✏️ 编辑</button>
                        <button class="btn btn-sm btn-primary save-btn" onclick="saveEditCompetitor(${c.id}, this)" style="display: none;">💾 保存</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCompetitorItem(${c.id})">🗑️ 删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 添加新竞店
        async function addNewCompetitor() {
            const input = document.getElementById('newCompetitorName');
            const name = input.value.trim();
            
            if (!name) {
                showToast('请输入竞店名称', 'error');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/competitor-stores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_name: currentManagingStore,
                        competitor_name: name
                    })
                });
                
                if (res.ok) {
                    showToast('添加成功', 'success');
                    input.value = '';
                    // 刷新列表
                    const refreshRes = await fetch(`${API_BASE}/api/competitor-stores/${encodeURIComponent(currentManagingStore)}`);
                    currentStoreCompetitors = await refreshRes.json();
                    document.getElementById('competitorsList').innerHTML = renderCompetitorsList();
                    // 刷新主列表
                    loadCompetitorStores();
                } else {
                    const err = await res.json();
                    showToast(err.detail || '添加失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }
        
        // 开始编辑
        function startEditCompetitor(id, btn) {
            const item = btn.closest('.competitor-item');
            const nameSpan = item.querySelector('.competitor-name');
            const editInput = item.querySelector('.competitor-edit-input');
            const saveBtn = item.querySelector('.save-btn');
            const editBtn = item.querySelector('.edit-btn');
            
            nameSpan.style.display = 'none';
            editInput.style.display = 'block';
            editBtn.style.display = 'none';
            saveBtn.style.display = 'inline-flex';
            editInput.focus();
        }
        
        // 保存编辑
        async function saveEditCompetitor(id, btn) {
            const item = btn.closest('.competitor-item');
            const editInput = item.querySelector('.competitor-edit-input');
            const newName = editInput.value.trim();
            
            if (!newName) {
                showToast('竞店名称不能为空', 'error');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/competitor-stores/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ competitor_name: newName })
                });
                
                if (res.ok) {
                    showToast('修改成功', 'success');
                    // 刷新列表
                    const refreshRes = await fetch(`${API_BASE}/api/competitor-stores/${encodeURIComponent(currentManagingStore)}`);
                    currentStoreCompetitors = await refreshRes.json();
                    document.getElementById('competitorsList').innerHTML = renderCompetitorsList();
                    // 刷新主列表
                    loadCompetitorStores();
                } else {
                    const err = await res.json();
                    showToast(err.detail || '修改失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }
        
        // 删除竞店
        async function deleteCompetitorItem(id) {
            if (!confirm('确定要删除这个竞店吗？')) {
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/competitor-stores/${id}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    showToast('删除成功', 'success');
                    // 刷新列表
                    const refreshRes = await fetch(`${API_BASE}/api/competitor-stores/${encodeURIComponent(currentManagingStore)}`);
                    currentStoreCompetitors = await refreshRes.json();
                    document.getElementById('competitorsList').innerHTML = renderCompetitorsList();
                    // 刷新主列表
                    loadCompetitorStores();
                } else {
                    const err = await res.json();
                    showToast(err.detail || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        async function saveSurveyor() {
            const username = document.getElementById('surveyorUsername').value.trim();
            const password = document.getElementById('surveyorPassword').value;
            const name = document.getElementById('surveyorName').value.trim();
            const phone = document.getElementById('surveyorPhone').value.trim();
            
            // 表单验证
            if (!username) { showToast('请输入用户名', 'error'); return; }
            if (!/^[a-zA-Z0-9]{3,20}$/.test(username)) { showToast('用户名只能包含3-20位字母数字', 'error'); return; }
            if (!password) { showToast('请输入密码', 'error'); return; }
            if (password.length < 6) { showToast('密码至少6位', 'error'); return; }
            if (!name) { showToast('请输入姓名', 'error'); return; }
            if (name.length < 2 || name.length > 10) { showToast('姓名长度应为2-10个字符', 'error'); return; }
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的11位手机号码', 'error'); return; }
            
            // 检查用户名是否已存在
            const existing = currentData.surveyors.find(s => s.username === username);
            if (existing) { showToast('该用户名已存在', 'error'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/api/surveyors`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username, password, name, phone: phone || null }) 
                });
                if (res.ok) { 
                    showToast('添加成功', 'success'); 
                    closeModal(); 
                    loadSurveyors(); 
                } else {
                    const err = await res.json();
                    showToast(err.detail || '添加失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function loadReportData() {
            // 获取选择的年月
            const monthInput = document.getElementById('reportMonth');
            const [year, month] = monthInput.value.split('-').map(Number);
            
            try {
                // 并行获取月度趋势和人员统计数据
                const [trendRes, surveyorRes] = await Promise.all([
                    fetch(`/api/statistics/monthly-trend?year=${year}&month=${month}`),
                    fetch(`/api/statistics/surveyor-stats?year=${year}&month=${month}`)
                ]);
                
                const trendData = await trendRes.json();
                const surveyorData = await surveyorRes.json();
                
                // 渲染月度调研趋势图
                const ctx1 = document.getElementById('monthlyChart');
                if (ctx1) {
                    const days = trendData.map(d => `${d.day}日`);
                    const counts = trendData.map(d => d.record_count);
                    
                    new Chart(ctx1, {
                        type: 'bar', 
                        data: { 
                            labels: days, 
                            datasets: [{ 
                                label: '调研记录数', 
                                data: counts, 
                                backgroundColor: (context) => { 
                                    const ctx = context.chart.ctx; 
                                    const gradient = ctx.createLinearGradient(0, 0, 0, 300); 
                                    gradient.addColorStop(0, '#6366f1'); 
                                    gradient.addColorStop(1, '#8b5cf6'); 
                                    return gradient; 
                                }, 
                                borderRadius: 8 
                            }] 
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { legend: { display: false } }, 
                            scales: { 
                                y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { stepSize: 1 } }, 
                                x: { grid: { display: false } } 
                            }, 
                            animation: { duration: 1500, easing: 'easeOutQuart' } 
                        }
                    });
                }
                
                // 渲染人员调研统计饼图
                const ctx2 = document.getElementById('surveyorChart');
                if (ctx2) {
                    const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#9ca3af', '#8b5cf6'];
                    new Chart(ctx2, {
                        type: 'pie', 
                        data: { 
                            labels: surveyorData.map(s => s.name), 
                            datasets: [{ 
                                data: surveyorData.map(s => s.record_count), 
                                backgroundColor: colors.slice(0, surveyorData.length), 
                                borderWidth: 0 
                            }] 
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                            const value = context.raw;
                                            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                            return `${context.label}: ${value}条 (${percentage}%)`;
                                        }
                                    }
                                }
                            },
                            animation: { animateRotate: true, duration: 2000 } 
                        }
                    });
                }
                
                // 渲染详细数据表格（取最近7天有数据的）
                const recentData = trendData.filter(d => d.record_count > 0).slice(-7).reverse();
                const tableHtml = recentData.map((r, i) => `
                    <tr style="animation-delay: ${i * 0.1}s">
                        <td><strong>${r.date.slice(5)}</strong></td>
                        <td>${r.record_count}</td>
                        <td><span class="tag tag-success">${r.record_count > 0 ? '有数据' : '无数据'}</span></td>
                    </tr>
                `).join('');
                document.getElementById('reportTable').innerHTML = tableHtml || '<tr><td colspan="3" style="text-align:center;color:#999;">本月暂无数据</td></tr>';
                
            } catch (e) {
                console.error('加载报表数据失败:', e);
                showToast('加载报表数据失败', 'error');
            }
        }

        async function loadProductsByFilter() {
            const listContainer = document.getElementById('productList');
            const statsContainer = document.getElementById('productStats');
            
            if (listContainer) {
                listContainer.innerHTML = '<div class="empty-state"><span class="icon">⏳</span><p>加载中...</p></div>';
            }
            
            try {
                // 构建查询参数
                let params = new URLSearchParams();
                params.append('limit', productPageState.pageSize);
                params.append('skip', (productPageState.page - 1) * productPageState.pageSize);
                
                if (productPageState.keyword) {
                    params.append('keyword', productPageState.keyword);
                }
                if (productPageState.level1) {
                    params.append('level1', productPageState.level1);
                }
                if (productPageState.level2) {
                    params.append('level2', productPageState.level2);
                }
                if (productPageState.level3) {
                    params.append('level3', productPageState.level3);
                }
                if (productPageState.level4) {
                    params.append('level4', productPageState.level4);
                }
                
                const res = await fetch(`${API_BASE}/api/products?${params.toString()}`);
                const products = await res.json();
                
                // 获取总数（简化为当前返回数量，实际应该后端返回总数）
                // 这里用另一种方式估算总数
                let countParams = new URLSearchParams();
                if (productPageState.keyword) countParams.append('keyword', productPageState.keyword);
                if (productPageState.level1) countParams.append('level1', productPageState.level1);
                if (productPageState.level2) countParams.append('level2', productPageState.level2);
                if (productPageState.level3) countParams.append('level3', productPageState.level3);
                if (productPageState.level4) countParams.append('level4', productPageState.level4);
                countParams.append('limit', '1000');
                
                const countRes = await fetch(`${API_BASE}/api/products?${countParams.toString()}`);
                const allFiltered = await countRes.json();
                productPageState.total = allFiltered.length;
                
                renderProductCards(products);
                renderProductPageStats(products.length);
                renderProductPagination();
                
            } catch (e) {

        function renderProductPageStats(count) {
            const statsContainer = document.getElementById('productStats');
            if (statsContainer) {
                const start = (productPageState.page - 1) * productPageState.pageSize + 1;
                const end = Math.min(start + count - 1, productPageState.total);
                statsContainer.textContent = `显示 ${start}-${end} 条，共 ${productPageState.total} 条`;
            }
        }
        
        function renderProductPagination() {
            const container = document.getElementById('productPagination');
            if (!container) return;
            
            const totalPages = Math.ceil(productPageState.total / productPageState.pageSize);
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 上一页
            html += `<button class="btn btn-sm ${productPageState.page === 1 ? 'btn-disabled' : 'btn-default'}" onclick="changeProductPage(${productPageState.page - 1})" ${productPageState.page === 1 ? 'disabled' : ''}>上一页</button>`;
            
            // 页码
            const maxVisible = 5;
            let startPage = Math.max(1, productPageState.page - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                html += `<button class="btn btn-sm btn-default" onclick="changeProductPage(1)">1</button>`;
                if (startPage > 2) html += `<span style="padding: 4px 8px;">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="btn btn-sm ${i === productPageState.page ? 'btn-primary' : 'btn-default'}" onclick="changeProductPage(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span style="padding: 4px 8px;">...</span>`;
                html += `<button class="btn btn-sm btn-default" onclick="changeProductPage(${totalPages})">${totalPages}</button>`;
            }
            
            // 下一页
            html += `<button class="btn btn-sm ${productPageState.page === totalPages ? 'btn-disabled' : 'btn-default'}" onclick="changeProductPage(${productPageState.page + 1})" ${productPageState.page === totalPages ? 'disabled' : ''}>下一页</button>`;
            
            container.innerHTML = html;
        }

                if (summaryData.success) {
                    animateNumber(document.getElementById('analysisTotalRecords'), summaryData.data.total_records);
                    animateNumber(document.getElementById('analysisTotalStores'), summaryData.data.total_stores);
                    animateNumber(document.getElementById('analysisTotalProducts'), summaryData.data.total_products);
                    document.getElementById('analysisAvgPriceIndex').textContent = (summaryData.data.avg_price_index * 100).toFixed(1) + '%';
                    animateNumber(document.getElementById('analysisWarningCount'), summaryData.data.warning_count);
                }
                
                // 加载门店分析
                const storeRes = await fetch(`${API_BASE}/api/analysis/store?start_date=${startDate}&end_date=${endDate}&own_store_name=${ownStore}`);
                const storeData = await storeRes.json();
                
                if (storeData.success) {
                    renderStoreAnalysisTable(storeData.data);
                }
                
                // 加载采购分析
                const purchaseRes = await fetch(`${API_BASE}/api/analysis/purchase?start_date=${startDate}&end_date=${endDate}&own_store_name=${ownStore}`);
                const purchaseData = await purchaseRes.json();
                
                if (purchaseData.success) {
                    renderPurchaseAnalysisTable(purchaseData.data);
                }
                
            } catch (e) {
                console.error('加载分析数据失败:', e);
                showToast('加载分析数据失败', 'error');
                document.getElementById('storeAnalysisTable').querySelector('tbody').innerHTML = 
                    '<tr><td colspan="9" class="empty-state"><span class="icon">❌</span><p>加载失败</p></td></tr>';
                document.getElementById('purchaseAnalysisTable').querySelector('tbody').innerHTML = 
                    '<tr><td colspan="9" class="empty-state"><span class="icon">❌</span><p>加载失败</p></td></tr>';
            }
        }
        
        function renderStoreAnalysisTable(data) {
            const tbody = document.getElementById('storeAnalysisTable').querySelector('tbody');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><span class="icon">📭</span><p>暂无数据</p></td></tr>';
                return;
            }
            
            const html = data.map((row, i) => {
                // 调前/调后价格指数>0.95标红
                const priceIndexBeforeClass = row.price_index_before > 0.95 ? 'style="color: #dc2626; font-weight: 700;"' : '';
                const priceIndexAfterClass = row.price_index_after > 0.95 ? 'style="color: #dc2626; font-weight: 700;"' : '';
                
                // 生成商品详情tooltip内容
                const productDetails = row.product_details || [];
                const tooltipContent = productDetails.map(p => 
                    `• ${p.product_name} | 竞店:${p.competitor_store || '-'} | 售价:${p.competitor_price || '-'}${p.promotion_info ? ' ('+p.promotion_info+')' : ''}`
                ).join('\\n');
                
                return `
                    <tr style="animation-delay: ${i * 0.03}s">
                        <td><strong>${row.own_store}</strong></td>
                        <td>${row.category2}</td>
                        <td>${row.sale_price.toFixed(2)}</td>
                        <td>${row.adjusted_price.toFixed(2)}</td>
                        <td>${row.competitor_price_avg.toFixed(2)}</td>
                        <td ${priceIndexBeforeClass}>${(row.price_index_before * 100).toFixed(2)}%</td>
                        <td ${priceIndexAfterClass}>${(row.price_index_after * 100).toFixed(2)}%</td>
                        <td>${(row.gross_margin_before * 100).toFixed(2)}%</td>
                        <td>${(row.gross_margin_after * 100).toFixed(2)}%</td>
                        <td><span class="tag tag-default" style="cursor: pointer;" onmouseenter="showProductTooltip(event, '${escapeHtml(tooltipContent)}')" onmouseleave="hideProductTooltip()">${row.survey_product_count}</span></td>
                    </tr>
                `;
            }).join('');
            
            tbody.innerHTML = html;
        }
        
        function renderPurchaseAnalysisTable(data) {
            const tbody = document.getElementById('purchaseAnalysisTable').querySelector('tbody');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><span class="icon">📭</span><p>暂无数据</p></td></tr>';
                return;
            }
            
            const html = data.map((row, i) => {
                // 调前/调后价格指数>0.95标红
                const priceIndexBeforeClass = row.price_index_before > 0.95 ? 'style="color: #dc2626; font-weight: 700;"' : '';
                const priceIndexAfterClass = row.price_index_after > 0.95 ? 'style="color: #dc2626; font-weight: 700;"' : '';
                
                // 生成商品详情tooltip内容
                const productDetails = row.product_details || [];
                const tooltipContent = productDetails.map(p => 
                    `• ${p.product_name} | 竞店:${p.competitor_store || '-'} | 售价:${p.competitor_price || '-'}${p.promotion_info ? ' ('+p.promotion_info+')' : ''}`
                ).join('\\n');
                
                return `
                    <tr style="animation-delay: ${i * 0.03}s">
                        <td><strong>${row.purchaser}</strong></td>
                        <td>${row.category3}</td>
                        <td>${row.sale_price.toFixed(2)}</td>
                        <td>${row.adjusted_price.toFixed(2)}</td>
                        <td>${row.competitor_price_avg.toFixed(2)}</td>
                        <td ${priceIndexBeforeClass}>${(row.price_index_before * 100).toFixed(2)}%</td>
                        <td ${priceIndexAfterClass}>${(row.price_index_after * 100).toFixed(2)}%</td>
                        <td>${(row.gross_margin_before * 100).toFixed(2)}%</td>
                        <td>${(row.gross_margin_after * 100).toFixed(2)}%</td>
                        <td><span class="tag tag-default" style="cursor: pointer;" onmouseenter="showProductTooltip(event, '${escapeHtml(tooltipContent)}')" onmouseleave="hideProductTooltip()">${row.survey_product_count}</span></td>
                    </tr>
                `;
            }).join('');
            
            tbody.innerHTML = html;
        }
        
        function resetMarketAnalysisFilter() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('analysisStartDate').value = today;
            document.getElementById('analysisEndDate').value = today;
            document.getElementById('analysisStoreFilter').value = '';
            loadMarketAnalysis();
        }
        
        function exportMarketAnalysis() {
            const startDate = document.getElementById('analysisStartDate').value;
            const endDate = document.getElementById('analysisEndDate').value;
            const ownStore = document.getElementById('analysisStoreFilter').value;
            
            showToast('正在导出，请稍候...', 'success');
            
            // 构建URL并下载
            let url = `${API_BASE}/api/analysis/export?start_date=${startDate}&end_date=${endDate}`;
            if (ownStore) {
                url += `&own_store_name=${encodeURIComponent(ownStore)}`;
            }
            
            window.open(url);
        }
        
        // 加载门店下拉选项
        async function loadAnalysisStoreOptions() {
            try {
                // 从竞店API获取门店列表
                const res = await fetch(`${API_BASE}/api/competitor-stores/stores`);
                const stores = await res.json();
                
                const select = document.getElementById('analysisStoreFilter');
                if (select && stores && stores.length > 0) {
                    select.innerHTML = '<option value="">所有门店</option>' + 
                        stores.map(s => `<option value="${s}">${s}</option>`).join('');
                }
            } catch (e) {
                console.error('加载门店选项失败:', e);
            }
        }
        
        // HTML转义函数，防止XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        // 商品详情Tooltip
        let productTooltip = null;
        
        function showProductTooltip(event, content) {
            // 移除已有的tooltip
            hideProductTooltip();
            
            if (!content) return;
            
            // 创建tooltip元素
            productTooltip = document.createElement('div');
            productTooltip.className = 'product-tooltip';
            productTooltip.innerHTML = `
                <div style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%); 
                            color: white; 
                            padding: 16px; 
                            border-radius: 12px; 
                            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
                            max-width: 400px; 
                            max-height: 300px; 
                            overflow-y: auto;
                            font-size: 13px;
                            line-height: 1.6;
                            border: 1px solid rgba(255,255,255,0.1);">
                    <div style="font-weight: 700; margin-bottom: 10px; color: #60a5fa; font-size: 14px;">
                        📦 调研商品详情 (${content.split('\\n').length}个)
                    </div>
                    <div style="white-space: pre-line;">${content.replace(/\\n/g, '<br>')}</div>
                </div>
            `;
            
            // 设置位置
            const rect = event.target.getBoundingClientRect();
            productTooltip.style.cssText = `
                position: fixed;
                z-index: 10000;
                left: ${rect.left}px;
                top: ${rect.bottom + 10}px;
                pointer-events: none;
                animation: tooltipFadeIn 0.2s ease;
            `;
            
            document.body.appendChild(productTooltip);
            
            // 调整位置防止超出屏幕
            const tooltipRect = productTooltip.getBoundingClientRect();
            if (tooltipRect.right > window.innerWidth) {
                productTooltip.style.left = (window.innerWidth - tooltipRect.width - 20) + 'px';
            }
            if (tooltipRect.bottom > window.innerHeight) {
                productTooltip.style.top = (rect.top - tooltipRect.height - 10) + 'px';
            }
        }
        
        function hideProductTooltip() {
            if (productTooltip) {
                productTooltip.remove();
                productTooltip = null;
            }
        }
        
        // 添加tooltip动画样式
        const tooltipStyle = document.createElement('style');
        tooltipStyle.textContent = `
            @keyframes tooltipFadeIn {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .product-tooltip::-webkit-scrollbar {
                width: 6px;
            }
            .product-tooltip::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.1);
                border-radius: 3px;
            }
            .product-tooltip::-webkit-scrollbar-thumb {
                background: rgba(255,255,255,0.3);
                border-radius: 3px;
            }
        `;
        document.head.appendChild(tooltipStyle);
        
        // 页面加载完成后加载门店选项
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadAnalysisStoreOptions, 1000);
        });
    </script>
</body>
</html>
